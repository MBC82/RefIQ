ize:.9rem; min-height:44px; padding:.4rem .9rem; border-radius:6px; cursor:pointer; background:var(--card); color:var(--ink); border:1.5px solid var(--line)}\n.self .yes[aria-pressed=\"true\"]{background:var(--ok); border-color:var(--ok); color:var(--paper)}\n.self .no[aria-pressed=\"true\"]{background:var(--redpen); border-color:var(--redpen); color:var(--paper)}\nbutton:focus-visible, a:focus-visible{outline:3px solid var(--pen); outline-offset:2px}\n.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.05; font-size:.85em; margin:0 .08em}\n.fr span:first-child{border-bottom:1.5px solid currentColor; padding:0 .15em}\n.hand .fr{font-size:.8em}\ntable.data{border-collapse:collapse; margin:.5rem 0; font-size:.95rem}\n.tscroll{overflow-x:auto; max-width:100%}\ntable.data td,table.data th{border:1px solid var(--line); padding:.3rem .55rem; text-align:center; white-space:nowrap}\n#review{border:2px solid var(--ink); background:var(--card); border-radius:4px; padding:1rem}\n#review h2{border:0; margin:0 0 .4rem; padding:0}\n#review ul{margin:.4rem 0 0; padding-left:1.2rem}\n#review li{margin:.2rem 0}\n@media (prefers-reduced-motion: no-preference){ .q.open .ans{animation:ink .25s ease-out} @keyframes ink{from{opacity:0}to{opacity:1}} }\n\n\ndetails.ans{display:block;margin-top:.75rem;padding:0;border:0}\ndetails.ans>summary{display:inline-block;list-style:none;font-weight:700;font-size:.95rem;color:var(--pen);border:1.5px solid var(--pen);border-radius:6px;padding:.55rem .9rem;cursor:pointer}\ndetails.ans>summary::-webkit-details-marker{display:none}\ndetails.ans[open]>summary{display:none}\ndetails.ans .inner{padding-top:.7rem;border-top:1px dashed var(--line)}\n.self,.tally,#review-wrap{display:none}\n.restart{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;font-size:1.05rem;color:#fff;text-decoration:none;background:var(--pen);border:2px solid var(--pen);border-radius:8px;padding:.7rem 1.2rem;min-height:48px;box-shadow:0 2px 0 var(--ink)}\n.restart:active{transform:translateY(2px);box-shadow:none}\n:root:not([data-theme=\"light\"]) .restart{color:var(--paper)}\n.topbar{position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:2px solid var(--ink);padding:.6rem 0;margin:1rem 0;display:flex;align-items:center;justify-content:flex-end;gap:.75rem}\n.topbar .tally{position:static;border:0;padding:0;margin:0;flex:1 1 0;min-width:0;background:none;flex-direction:column;align-items:stretch;gap:.35rem;font-size:.9rem}\n.topbar .tally .bar{flex:none;width:100%}\n.topbar .restart{flex:none}\n.restart-bottom{margin:2rem 0 1rem}\n.restart-bottom .restart{width:100%;font-size:1.15rem;min-height:56px}\n[hidden]{display:none!important}\n.modes{display:none;margin:1rem 0 0}\nhtml.js .modes{display:flex}\n.modes button{flex:1 1 0;min-height:46px;font:inherit;font-size:.92rem;font-weight:700;border:1.5px solid var(--pen);background:var(--card);color:var(--pen);padding:.4rem .4rem;cursor:pointer}\n.modes button+button{border-left:0}\n.modes button:first-child{border-radius:8px 0 0 8px}.modes button:last-child{border-radius:0 8px 8px 0}\n.modes button[aria-pressed=\"true\"]{background:var(--pen);color:var(--paper)}\n.modehint{color:var(--muted);font-size:.92rem;margin:.5rem 0 0}\n.retry{display:none;margin-top:.75rem;font:inherit;font-size:.95rem;font-weight:700;color:var(--redpen);background:none;border:1.5px solid var(--redpen);border-radius:6px;padding:.55rem .9rem;min-height:44px;cursor:pointer}\nhtml.js .q.miss .retry{display:inline-block}\n.q.practicing .retry{display:none!important}\n.pcard{margin-top:.9rem;padding:.9rem;border:1.5px dashed var(--pen);border-radius:6px;background:var(--paper)}\n.pcard>.kind{color:var(--pen);font-weight:700}\n.pself{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}\n.pself button{font:inherit;font-size:.9rem;min-height:44px;padding:.4rem .9rem;border-radius:6px;cursor:pointer}\n.pgot{background:var(--ok);border:1.5px solid var(--ok);color:var(--paper)}\n.pnew{background:var(--card);border:1.5px solid var(--redpen);color:var(--redpen)}\n#nomissed{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1rem}\nhtml.js .self{display:flex} html.js .tally{display:flex} html.js #review-wrap{display:block}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <h1>Chapter 1 concept check<\/h1>\n  <p>Same topics as the test review, but these questions ask <em>why<\/em> and try to catch the mistakes that cost points. Try them without a calculator.<\/p>\n  <p class=\"how\">Work each one on paper first. Then show the answer and check yourself honestly.<\/p>\n<\/header>\n<div class=\"modes\" role=\"group\" aria-label=\"How to practice\"><button type=\"button\" data-mode=\"topic\">By topic<\/button><button type=\"button\" data-mode=\"mixed\">Mixed test<\/button><button type=\"button\" data-mode=\"missed\">Missed only<\/button><\/div>\n<p class=\"modehint\" id=\"modehint\" hidden><\/p>\n<nav id=\"nav\" aria-label=\"Topics\"><a href=\"#frac\">Simplifying and mixed numbers<\/a><a href=\"#abs\">Absolute value<\/a><a href=\"#ints\">Integers in real situations<\/a><a href=\"#add\">Adding integers<\/a><a href=\"#sub\">Subtracting integers<\/a><a href=\"#rat\">Fractions and mixed numbers with signs<\/a><a href=\"#multi\">Multi-step problems and range<\/a><\/nav>\n<div class=\"topbar\"><div class=\"tally\" aria-live=\"polite\"><span id=\"score\"><\/span><div class=\"bar\" aria-hidden=\"true\"><i class=\"g\" id=\"barG\"><\/i><i class=\"m\" id=\"barM\"><\/i><\/div><\/div><a class=\"restart\" href=\"\">↺ Start over<\/a><\/div>\n<main id=\"main\"><section id=\"mixed\" hidden><\/section><p id=\"nomissed\" hidden>Nothing marked missed yet. Mark questions as you go, then come back here to retest them.<\/p><section id=\"frac\" data-topic=\"frac\"><h2>Simplifying and mixed numbers<\/h2><p class=\"skill\">Builds on Review questions 1–2<\/p><div class=\"q\" data-id=\"1\" data-s=\"frac\"><div class=\"qhead\"><span class=\"num\">1.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>Without doing any division, how can you tell <span class=\"fr\"><span>7<\/span><span>21<\/span><\/span> is <b>not<\/b> simplified but <span class=\"fr\"><span>7<\/span><span>3<\/span><\/span> <b>is<\/b>?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">7 and 21 share a factor of 7. 7 and 3 share nothing but 1.<\/p><p class=\"why\">A fraction is simplified when the numerator and denominator have no common factor other than 1. It has nothing to do with whether the fraction is bigger than 1 — <span class=\"fr\"><span>7<\/span><span>3<\/span><\/span> is improper but still simplified.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"2\" data-s=\"frac\"><div class=\"qhead\"><span class=\"num\">2.<\/span><div class=\"qtext\"><span class=\"kind\">Find the mistake<\/span>A student simplified <span class=\"fr\"><span>12<\/span><span>18<\/span><\/span> and got <span class=\"fr\"><span>4<\/span><span>6<\/span><\/span>, then stopped. What's wrong, and what's the correct answer?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Not finished. <span class=\"fr\"><span>12<\/span><span>18<\/span><\/span> = <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span><\/p><p class=\"why\">4 and 6 still share a factor of 2. Dividing by the <b>greatest<\/b> common factor (6) gets you there in one step.<\/p><p class=\"watch\"><b>Watch out:<\/b> Always check your answer one more time: can both numbers still be divided by the same thing?<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"3\" data-s=\"frac\"><div class=\"qhead\"><span class=\"num\">3.<\/span><div class=\"qtext\"><span class=\"kind\">True or false<\/span>“If the denominator is an odd number, the fraction is already simplified.”<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">False. Example: <span class=\"fr\"><span>9<\/span><span>15<\/span><\/span> = <span class=\"fr\"><span>3<\/span><span>5<\/span><\/span><\/p><p class=\"why\">Odd numbers can share odd factors like 3, 5, or 7. Only a shared factor matters.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"4\" data-s=\"frac\"><div class=\"qhead\"><span class=\"num\">4.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>Explain <b>why<\/b> 6<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> equals <span class=\"fr\"><span>25<\/span><span>4<\/span><\/span> — not the shortcut, the reason.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">6 wholes = 24 fourths, plus 1 more fourth = 25 fourths<\/p><p class=\"why\">Each whole is <span class=\"fr\"><span>4<\/span><span>4<\/span><\/span>, so 6 wholes is <span class=\"fr\"><span>24<\/span><span>4<\/span><\/span>. The shortcut (6 × 4 + 1) is just counting those fourths quickly.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"5\" data-s=\"frac\"><div class=\"qhead\"><span class=\"num\">5.<\/span><div class=\"qtext\"><span class=\"kind\">Go backwards<\/span>Write <span class=\"fr\"><span>38<\/span><span>5<\/span><\/span> as a mixed number.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">7<span class=\"fr\"><span>3<\/span><span>5<\/span><\/span><\/p><p class=\"why\">5 goes into 38 seven times (35), with 3 fifths left over.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"6\" data-s=\"frac\"><div class=\"qhead\"><span class=\"num\">6.<\/span><div class=\"qtext\"><span class=\"kind\">Odd one out<\/span>Which one is <b>not<\/b> equal to the others?<br>3<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>, &nbsp;<span class=\"fr\"><span>7<\/span><span>2<\/span><\/span>, &nbsp;<span class=\"fr\"><span>14<\/span><span>4<\/span><\/span>, &nbsp;<span class=\"fr\"><span>21<\/span><span>7<\/span><\/span><\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\"><span class=\"fr\"><span>21<\/span><span>7<\/span><\/span> — it equals 3, the rest equal 3½<\/p><p class=\"why\"><span class=\"fr\"><span>14<\/span><span>4<\/span><\/span> simplifies to <span class=\"fr\"><span>7<\/span><span>2<\/span><\/span>, which is 3<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>. But <span class=\"fr\"><span>21<\/span><span>7<\/span><\/span> = 3 exactly.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<\/section><section id=\"abs\" data-topic=\"abs\"><h2>Absolute value<\/h2><p class=\"skill\">Builds on Review questions 3, 4, 6<\/p><div class=\"q\" data-id=\"7\" data-s=\"abs\"><div class=\"qhead\"><span class=\"num\">7.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>What does absolute value actually measure? Use that to explain why it can never be negative.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Distance from 0 on the number line<\/p><p class=\"why\">Distance is always zero or positive — you can't walk −5 steps. So |−8| and |8| are both 8 because both numbers are 8 steps from 0.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"8\" data-s=\"abs\"><div class=\"qhead\"><span class=\"num\">8.<\/span><div class=\"qtext\"><span class=\"kind\">Watch the sign<\/span>Evaluate: &nbsp;−|−30|<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−30<\/p><p class=\"why\">Do the bars first: |−30| = 30. The negative sign <b>outside<\/b> the bars is still waiting, so the answer is −30.<\/p><p class=\"watch\"><b>Watch out:<\/b> The bars only make what's <b>inside<\/b> them non-negative. A sign outside the bars stays.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"9\" data-s=\"abs\"><div class=\"qhead\"><span class=\"num\">9.<\/span><div class=\"qtext\"><span class=\"kind\">Think it through<\/span>Name every number whose absolute value is 9. Then: is there any number with absolute value −9?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">9 and −9. &nbsp;No number has |x| = −9.<\/p><p class=\"why\">Two numbers are 9 steps from zero — one on each side. No distance can be negative.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"10\" data-s=\"abs\"><div class=\"qhead\"><span class=\"num\">10.<\/span><div class=\"qtext\"><span class=\"kind\">True or false<\/span>“If one number is less than another, its absolute value is also less.”<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">False. −7 &lt; 2, but |−7| &gt; |2|<\/p><p class=\"why\">Negative numbers get <em>smaller<\/em> as they get farther from 0, but their absolute value gets <em>bigger<\/em>.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"11\" data-s=\"abs\"><div class=\"qhead\"><span class=\"num\">11.<\/span><div class=\"qtext\"><span class=\"kind\">Compare<\/span>Fill in &lt;, &gt;, or =.<br>a. &nbsp;−8 ___ −3 &nbsp;&nbsp;&nbsp; b. &nbsp;|−8| ___ |−3|<br>Why do the two answers point in opposite directions?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">a. &nbsp;−8 &lt; −3 &nbsp;&nbsp; b. &nbsp;8 &gt; 3<\/p><p class=\"why\">−8 is farther left on the number line, so it's less. But it's farther from zero, so its absolute value is greater.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"12\" data-s=\"abs\"><div class=\"qhead\"><span class=\"num\">12.<\/span><div class=\"qtext\"><span class=\"kind\">Order<\/span>Order from least to greatest:<br>|−6|, &nbsp;−6, &nbsp;0, &nbsp;|4|, &nbsp;−|−2|<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−6, &nbsp;−|−2|, &nbsp;0, &nbsp;|4|, &nbsp;|−6|<\/p><p class=\"why\">Rewrite each value first: 6, −6, 0, 4, −2. Then order: −6, −2, 0, 4, 6.<\/p><p class=\"watch\"><b>Watch out:<\/b> Don't skip rewriting. −|−2| is −2, not 2.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<\/section><section id=\"ints\" data-topic=\"ints\"><h2>Integers in real situations<\/h2><p class=\"skill\">Builds on Review questions 7, 18<\/p><div class=\"q\" data-id=\"13\" data-s=\"ints\"><div class=\"qhead\"><span class=\"num\">13.<\/span><div class=\"qtext\"><span class=\"kind\">Write the integer<\/span>Write an integer for each:<br>a. 40 feet below sea level<br>b. The temperature rose 12 degrees<br>c. You withdraw $25 from the bank<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">a. −40 &nbsp; b. +12 &nbsp; c. −25<\/p><p class=\"why\">Look for direction words. Below, down, lose, withdraw, back → negative. Above, up, gain, deposit, forward → positive.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"14\" data-s=\"ints\"><div class=\"qhead\"><span class=\"num\">14.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>Which is colder: −15°F or −4°F? Explain using a number line, not just a rule.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−15°F is colder<\/p><p class=\"why\">On a number line, −15 sits to the left of −4. Farther left means less, and less means colder.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"15\" data-s=\"ints\"><div class=\"qhead\"><span class=\"num\">15.<\/span><div class=\"qtext\"><span class=\"kind\">Word problem<\/span>A diver is 12 feet below the surface. She rises 7 feet, then dives down 10 feet. Write an expression, then find her position.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−12 + 7 − 10 = −15 &nbsp;(15 ft below)<\/p><p class=\"why\">Start at −12. Rising 7 gets to −5. Diving 10 more gets to −15.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<\/section><section id=\"add\" data-topic=\"add\"><h2>Adding integers<\/h2><p class=\"skill\">Builds on Review questions 5, 8, 9, 12<\/p><div class=\"q\" data-id=\"16\" data-s=\"add\"><div class=\"qhead\"><span class=\"num\">16.<\/span><div class=\"qtext\"><span class=\"kind\">Predict<\/span>Without adding, will −45 + 30 be positive, negative, or zero? Explain how you know.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Negative<\/p><p class=\"why\">The signs are different, so the answer takes the sign of the number farther from zero. |−45| is bigger than |30|, so the negative “wins.”<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"17\" data-s=\"add\"><div class=\"qhead\"><span class=\"num\">17.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>The review showed 30 + (−30) = 0. When does adding a positive and a negative give exactly zero?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">When they're opposites (same distance from 0)<\/p><p class=\"why\">Numbers like 30 and −30 are called additive inverses. They cancel out completely.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"18\" data-s=\"add\"><div class=\"qhead\"><span class=\"num\">18.<\/span><div class=\"qtext\"><span class=\"kind\">Find the mistake<\/span>A student says: “Two negatives make a positive, so −8 + (−5) = 13.” What's wrong?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−8 + (−5) = −13<\/p><p class=\"why\">Adding two negatives moves you farther left on the number line, so the sum is negative. Add the distances (8 + 5) and keep the negative sign.<\/p><p class=\"watch\"><b>Watch out:<\/b> “Two negatives make a positive” is about <b>subtracting<\/b> a negative (and later, multiplying). It is not a rule for adding.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"19\" data-s=\"add\"><div class=\"qhead\"><span class=\"num\">19.<\/span><div class=\"qtext\"><span class=\"kind\">Missing number<\/span>Find the missing number.<br>a. −17 + ___ = 0<br>b. 23 + ___ = 5<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">a. 17 &nbsp;&nbsp; b. −18<\/p><p class=\"why\">a: the opposite of −17 cancels it. b: to get from 23 down to 5 you have to move 18 to the left, which is adding −18.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"20\" data-s=\"add\"><div class=\"qhead\"><span class=\"num\">20.<\/span><div class=\"qtext\"><span class=\"kind\">Always, sometimes, never<\/span>“The sum of a positive number and a negative number is negative.”<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Sometimes<\/p><p class=\"why\">−10 + 3 = −7 (negative), but −3 + 10 = 7 (positive), and −5 + 5 = 0. It depends on which number is farther from zero.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<\/section><section id=\"sub\" data-topic=\"sub\"><h2>Subtracting integers<\/h2><p class=\"skill\">Builds on Review questions 10, 11, 13<\/p><div class=\"q\" data-id=\"21\" data-s=\"sub\"><div class=\"qhead\"><span class=\"num\">21.<\/span><div class=\"qtext\"><span class=\"kind\">Rewrite<\/span>Rewrite each subtraction as addition. Don't solve yet.<br>a. −25 − (−5) &nbsp;&nbsp; b. 23 − 98 &nbsp;&nbsp; c. 65 − (−45)<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">a. −25 + 5 &nbsp; b. 23 + (−98) &nbsp; c. 65 + 45<\/p><p class=\"why\">Subtracting a number is the same as adding its opposite. Keep the first number, change subtraction to addition, flip the sign of the second number.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"22\" data-s=\"sub\"><div class=\"qhead\"><span class=\"num\">22.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>Why does <b>subtracting<\/b> a negative number make the result <b>bigger<\/b>? Use money or a real example.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Taking away a debt leaves you better off<\/p><p class=\"why\">If someone erases a $5 debt you owed (subtracting −5), your net worth goes up by $5. Removing something negative is a positive change.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"23\" data-s=\"sub\"><div class=\"qhead\"><span class=\"num\">23.<\/span><div class=\"qtext\"><span class=\"kind\">Find the mistake<\/span>A student wrote 65 − (−45) = 20. What did they do wrong?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Correct answer: 110<\/p><p class=\"why\">They treated it like 65 − 45. Subtracting −45 means adding 45: 65 + 45 = 110.<\/p><p class=\"watch\"><b>Watch out:<\/b> When you see two negative-looking signs side by side, slow down and rewrite as addition first.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"24\" data-s=\"sub\"><div class=\"qhead\"><span class=\"num\">24.<\/span><div class=\"qtext\"><span class=\"kind\">Compare<\/span>Find 7 − 12 and 12 − 7. What do you notice? Does order matter in subtraction?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−5 and 5. &nbsp;Yes, order matters.<\/p><p class=\"why\">Switching the order gives you the opposite answer. Addition doesn't care about order; subtraction does.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"25\" data-s=\"sub\"><div class=\"qhead\"><span class=\"num\">25.<\/span><div class=\"qtext\"><span class=\"kind\">Distance<\/span>How far apart are −9 and 14 on a number line? Write it as a subtraction problem.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">14 − (−9) = 23<\/p><p class=\"why\">From −9 to 0 is 9 steps, from 0 to 14 is 14 more. 9 + 14 = 23. Subtracting (bigger − smaller) finds that distance in one step.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<\/section><section id=\"rat\" data-topic=\"rat\"><h2>Fractions and mixed numbers with signs<\/h2><p class=\"skill\">Builds on Review questions 14–15<\/p><div class=\"q\" data-id=\"26\" data-s=\"rat\"><div class=\"qhead\"><span class=\"num\">26.<\/span><div class=\"qtext\"><span class=\"kind\">Estimate first<\/span>Before solving, will −<span class=\"fr\"><span>2<\/span><span>3<\/span><\/span> + (−<span class=\"fr\"><span>3<\/span><span>4<\/span><\/span>) be greater than or less than −1? Then solve.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Less than −1. &nbsp;Answer: −1<span class=\"fr\"><span>5<\/span><span>12<\/span><\/span><\/p><p class=\"why\">Both numbers are more than half a unit left of zero, so together they pass −1. Common denominator 12: −<span class=\"fr\"><span>8<\/span><span>12<\/span><\/span> + (−<span class=\"fr\"><span>9<\/span><span>12<\/span><\/span>) = −<span class=\"fr\"><span>17<\/span><span>12<\/span><\/span> = −1<span class=\"fr\"><span>5<\/span><span>12<\/span><\/span>.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"27\" data-s=\"rat\"><div class=\"qhead\"><span class=\"num\">27.<\/span><div class=\"qtext\"><span class=\"kind\">Estimate first<\/span>−3<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> − 4<span class=\"fr\"><span>9<\/span><span>10<\/span><\/span>: about what should the answer be before you calculate? Then find the exact answer.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">About −8. &nbsp;Exact: −8<span class=\"fr\"><span>3<\/span><span>20<\/span><\/span><\/p><p class=\"why\">−3 and a bit, minus 4 and almost 1 more, lands just past −8. Exact: −<span class=\"fr\"><span>13<\/span><span>4<\/span><\/span> − <span class=\"fr\"><span>49<\/span><span>10<\/span><\/span> = −<span class=\"fr\"><span>65<\/span><span>20<\/span><\/span> − <span class=\"fr\"><span>98<\/span><span>20<\/span><\/span> = −<span class=\"fr\"><span>163<\/span><span>20<\/span><\/span> = −8<span class=\"fr\"><span>3<\/span><span>20<\/span><\/span>.<\/p><p class=\"watch\"><b>Watch out:<\/b> If your exact answer isn't close to your estimate, something went wrong — check it before moving on.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"28\" data-s=\"rat\"><div class=\"qhead\"><span class=\"num\">28.<\/span><div class=\"qtext\"><span class=\"kind\">Find the mistake<\/span>A student wrote −<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> + <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> = <span class=\"fr\"><span>2<\/span><span>6<\/span><\/span>. Find two things wrong.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Correct answer: <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span><\/p><p class=\"why\">1) You can't add denominators — you need a common one: −<span class=\"fr\"><span>2<\/span><span>4<\/span><\/span> + <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span>. 2) The signs were ignored. The positive <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> is farther from zero, so the answer is positive <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"29\" data-s=\"rat\"><div class=\"qhead\"><span class=\"num\">29.<\/span><div class=\"qtext\"><span class=\"kind\">Solve<\/span><span class=\"fr\"><span>5<\/span><span>6<\/span><\/span> − (−<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>)<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\"><span class=\"fr\"><span>7<\/span><span>6<\/span><\/span> = 1<span class=\"fr\"><span>1<\/span><span>6<\/span><\/span><\/p><p class=\"why\">Subtracting a negative means adding: <span class=\"fr\"><span>5<\/span><span>6<\/span><\/span> + <span class=\"fr\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>7<\/span><span>6<\/span><\/span>.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"30\" data-s=\"rat\"><div class=\"qhead\"><span class=\"num\">30.<\/span><div class=\"qtext\"><span class=\"kind\">Predict, then solve<\/span>−2<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> + 4<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>: is the answer positive or negative? Then solve.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Positive. &nbsp;1<span class=\"fr\"><span>5<\/span><span>6<\/span><\/span><\/p><p class=\"why\">4<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span> is farther from zero, so the answer is positive. −<span class=\"fr\"><span>15<\/span><span>6<\/span><\/span> + <span class=\"fr\"><span>26<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>11<\/span><span>6<\/span><\/span> = 1<span class=\"fr\"><span>5<\/span><span>6<\/span><\/span>.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<\/section><section id=\"multi\" data-topic=\"multi\"><h2>Multi-step problems and range<\/h2><p class=\"skill\">Builds on Review questions 16–19<\/p><div class=\"q\" data-id=\"31\" data-s=\"multi\"><div class=\"qhead\"><span class=\"num\">31.<\/span><div class=\"qtext\"><span class=\"kind\">Check your thinking<\/span>Solve 7 + (−11) + 8 two different ways: left to right, then by adding the positives first. Do you get the same answer? Why?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">4 both ways<\/p><p class=\"why\">Left to right: 7 + (−11) = −4, then −4 + 8 = 4. Positives first: 7 + 8 = 15, then 15 + (−11) = 4. When everything is addition, you can reorder.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"32\" data-s=\"multi\"><div class=\"qhead\"><span class=\"num\">32.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>Without a calculator, explain why −8 − (−6) + 2 equals 0.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−8 + 6 + 2 = −8 + 8 = 0<\/p><p class=\"why\">Rewrite the subtraction as + 6. The 6 and 2 together make +8, which cancels −8 exactly.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"33\" data-s=\"multi\"><div class=\"qhead\"><span class=\"num\">33.<\/span><div class=\"qtext\"><span class=\"kind\">Range<\/span>Low temperatures for a week:<div class='tscroll'><table class='data'><tr><th>Mon<\/th><th>Tue<\/th><th>Wed<\/th><th>Thu<\/th><th>Fri<\/th><\/tr><tr><td>−7<\/td><td>4<\/td><td>−12<\/td><td>9<\/td><td>−3<\/td><\/tr><\/table><\/div>Find the lowest, highest, and range. Then explain why the range is <b>not<\/b> 9 − 12.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Low −12, high 9, range 9 − (−12) = 21<\/p><p class=\"why\">Range is the distance between highest and lowest, so it can't be negative. 9 − 12 = −3 forgets that the lowest value is −12, not 12.<\/p><p class=\"watch\"><b>Watch out:<\/b> Write the negative number in parentheses: 9 − (−12). It keeps you from dropping the sign.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"34\" data-s=\"multi\"><div class=\"qhead\"><span class=\"num\">34.<\/span><div class=\"qtext\"><span class=\"kind\">Word problem<\/span>Your account is at −$40. You deposit $65, then a $30 charge comes out. Write one expression and find the balance.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−40 + 65 − 30 = −5<\/p><p class=\"why\">−40 + 65 = 25, then 25 − 30 = −5. Still overdrawn by $5.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"35\" data-s=\"multi\"><div class=\"qhead\"><span class=\"num\">35.<\/span><div class=\"qtext\"><span class=\"kind\">Work backwards<\/span>A set of numbers has a range of 50. The lowest value is −18. What is the highest value?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">32<\/p><p class=\"why\">Highest − (−18) = 50, so highest + 18 = 50, so highest = 32. Check: 32 − (−18) = 50.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"36\" data-s=\"multi\"><div class=\"qhead\"><span class=\"num\">36.<\/span><div class=\"qtext\"><span class=\"kind\">Create your own<\/span>Write a subtraction problem using <b>two negative numbers<\/b> where the answer is <b>positive<\/b>. Explain why it works.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Example: −3 − (−10) = 7<\/p><p class=\"why\">It becomes −3 + 10. It works whenever the number being subtracted is farther left (more negative) than the first number. If you can build examples like this, you really understand subtracting negatives.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<\/section><\/main>\n<section id=\"review-wrap\"><div id=\"review\"><\/div><\/section>\n<div class=\"restart-bottom\"><a class=\"restart\" href=\"\">↺ Start over<\/a><\/div>\n<\/div>\n<script>\ndocument.documentElement.classList.add(\"js\");\nconst R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);\nconst lcm=(a,b)=>a*b/gcd(a,b);\nconst I=n=>n<0?'−'+(-n):''+n;\nconst F=(n,d)=>`{${n}/${d}}`;\nfunction simp(n,d){const g=gcd(Math.abs(n),d)||1;return [n/g,d/g]}\nfunction mixed(n,d){[n,d]=simp(n,d);const s=n<0?'−':'';n=Math.abs(n);const w=Math.floor(n/d),r=n%d;if(r===0)return s+w;return s+(w?w:'')+F(r,d)}\nfunction cop(maxd,mind){let p,q;do{q=R(mind||2,maxd);p=R(1,q-1)}while(gcd(p,q)!==1);return [p,q]}\nfunction mix(){const d=pick([2,3,4,5,6,8,10]);let n;do{n=R(1,d-1)}while(gcd(n,d)!==1);const w=R(1,6);return {w,n,d,T:w*d+n}}\nconst distinct=(lo,hi)=>{const a=R(lo,hi);let b;do{b=R(lo,hi)}while(b===a);return [a,b]};\n\nconst GEN=[\n// 1\n()=>{const k=pick([2,3,5,7]);const [p,q]=cop(9);let x,y;do{x=R(4,13);y=R(2,9)}while(gcd(x,y)!==1||x<=y);\n return {q:`Without dividing, how can you tell ${F(k*p,k*q)} is <b>not<\/b> simplified but ${F(x,y)} <b>is<\/b>?`,\n a:`${k*p} and ${k*q} share a factor of ${k}. ${x} and ${y} share only 1.`,\n e:`${F(k*p,k*q)} simplifies to ${F(p,q)}. ${F(x,y)} is improper, but it has no common factor, so it's simplified.`}},\n// 2\n()=>{const [g,f]=pick([[4,2],[6,2],[6,3],[8,2],[8,4],[9,3],[12,2],[12,3],[12,4],[12,6]]);const [p,q]=cop(6);\n return {q:`A student simplified ${F(g*p,g*q)} and got ${F(g*p/f,g*q/f)}, then stopped. What's wrong, and what's the correct answer?`,\n a:`Not finished. ${F(g*p,g*q)} = ${F(p,q)}`,\n e:`${g*p/f} and ${g*q/f} still share a factor of ${g/f}. Dividing by the greatest common factor (${g}) gets there in one step.`}},\n// 3\n()=>{const k=pick([3,5,7]);let p,q;do{[p,q]=cop(9,3)}while(q%2===0);\n return {q:`Is ${F(k*p,k*q)} simplified? Its denominator is odd — does that matter?`,\n a:`No. ${F(k*p,k*q)} = ${F(p,q)}`,\n e:`${k*p} and ${k*q} both divide by ${k}. An odd denominator doesn't make a fraction simplified; only a shared factor matters.`}},\n// 4\n()=>{const {w,n,d,T}=mix();\n return {q:`Explain <b>why<\/b> ${w}${F(n,d)} equals ${F(T,d)} — not the shortcut, the reason.`,\n a:`${w} whole${w>1?'s':''} = ${w*d} pieces of ${F(1,d)}, plus ${n} more = ${T}`,\n e:`Each whole is ${F(d,d)}, so ${w} whole${w>1?'s':''} is ${F(w*d,d)}. Add ${F(n,d)} to get ${F(T,d)}.`}},\n// 5\n()=>{const {w,n,d,T}=mix();\n return {q:`Write ${F(T,d)} as a mixed number.`,a:`${w}${F(n,d)}`,\n e:`${d} goes into ${T} ${w} time${w>1?'s':''} (${w*d}), with ${n} left over.`}},\n// 6\n()=>{const {w,n,d,T}=mix();const k=pick([2,3,4,5,7].filter(x=>x!==d));const dist=F(w*k,k);\n const opts=shuffle([`${w}${F(n,d)}`,F(T,d),F(2*T,2*d),dist]);\n return {q:`Which one is <b>not<\/b> equal to the others?<br>${opts.join(', &nbsp;')}`,\n a:`${dist} — it equals ${w}, the rest equal ${w}${F(n,d)}`,\n e:`${F(2*T,2*d)} simplifies to ${F(T,d)}, which is ${w}${F(n,d)}. But ${dist} = ${w} exactly.`}},\n// 7\n()=>{const [a,b]=distinct(3,20);\n return {q:`Which is farther from 0: −${a} or ${b}? Use absolute value to decide, and say what absolute value measures.`,\n a:a>b?`−${a}, because |−${a}| = ${a} is more than ${b}`:`${b}, because ${b} is more than |−${a}| = ${a}`,\n e:`Absolute value is distance from 0, and distance ignores direction. So compare ${a} and ${b}.`}},\n// 8\n()=>{const [n,m]=distinct(4,40);\n return {q:`Evaluate: &nbsp;−|−${n}| + |−${m}|`,a:I(m-n),\n e:`Bars first: |−${n}| = ${n} and |−${m}| = ${m}. The negative outside the first bars stays, so it's −${n} + ${m} = ${I(m-n)}.`,\n w:`The bars only make what's <b>inside<\/b> them non-negative. A sign outside the bars stays.`}},\n// 9\n()=>{const n=R(2,25),m=R(2,25);\n return {q:`Solve |x| = ${n}. Then: how many numbers have |x| = −${m}?`,\n a:`${n} and −${n}. &nbsp;None have |x| = −${m}.`,\n e:`Two numbers are ${n} steps from zero, one on each side. No distance can be negative.`}},\n// 10\n()=>{const [a,b]=distinct(2,15);\n return {q:`−${a} &lt; ${b}. Is it also true that |−${a}| &lt; |${b}|?`,\n a:a<b?`Yes, this time: ${a} &lt; ${b}`:`No. ${a} &gt; ${b}`,\n e:`Being less on the number line doesn't mean being closer to 0. A negative number can be less but farther from 0, so you have to check the absolute values.`}},\n// 11\n()=>{const [a,b]=distinct(2,20);\n return {q:`Fill in &lt;, &gt;, or =.<br>a. &nbsp;−${a} ___ −${b} &nbsp;&nbsp;&nbsp; b. &nbsp;|−${a}| ___ |−${b}|<br>Why do the two answers point in opposite directions?`,\n a:`a. &nbsp;−${a} ${a>b?'&lt;':'&gt;'} −${b} &nbsp;&nbsp; b. &nbsp;${a} ${a>b?'&gt;':'&lt;'} ${b}`,\n e:`−${Math.max(a,b)} is farther left, so it's less. But it's farther from zero, so its absolute value is greater.`}},\n// 12\n()=>{let a,b,c;do{a=R(2,12);b=R(2,12);c=R(2,12)}while(a===b||a===c);\n const items=shuffle([{t:`|−${a}|`,v:a},{t:`−${a}`,v:-a},{t:'0',v:0},{t:`|${b}|`,v:b},{t:`−|−${c}|`,v:-c}]);\n const sorted=items.slice().sort((x,y)=>x.v-y.v);\n return {q:`Order from least to greatest:<br>${items.map(i=>i.t).join(', &nbsp;')}`,\n a:sorted.map(i=>i.t).join(', &nbsp;'),\n e:`Rewrite each value first: ${items.map(i=>I(i.v)).join(', ')}. Then order: ${sorted.map(i=>I(i.v)).join(', ')}.`}},\n// 13\n()=>{const ctx=shuffle([\n  n=>[`${n} feet below sea level`,-n],n=>[`The temperature rose ${n} degrees`,n],n=>[`You withdraw $${n}`,-n],\n  n=>[`You deposit $${n}`,n],n=>[`A team loses ${n} yards`,-n],n=>[`You move back ${n} spaces`,-n],\n  n=>[`A stock goes up $${n}`,n],n=>[`The temperature dropped ${n} degrees`,-n]]).slice(0,3).map(f=>f(R(3,60)));\n const L=['a','b','c'];\n return {q:`Write an integer for each:<br>${ctx.map((c,i)=>`${L[i]}. ${c[0]}`).join('<br>')}`,\n a:ctx.map((c,i)=>`${L[i]}. ${I(c[1])}`).join(' &nbsp; '),\n e:`Look for direction words. Below, down, lose, withdraw, back, drop → negative. Up, rose, deposit, gain → positive.`}},\n// 14\n()=>{const [a,b]=distinct(1,25);const hi=Math.max(a,b),lo=Math.min(a,b);\n return {q:`Which is colder: −${a}°F or −${b}°F? Explain using a number line.`,a:`−${hi}°F is colder`,\n e:`−${hi} sits to the left of −${lo}. Farther left means less, and less means colder.`}},\n// 15\n()=>{const s=R(5,20),r=R(2,12),d=R(4,15);const res=-s+r-d;\n const c=pick([[`A diver is ${s} feet below the surface. She rises ${r} feet, then dives down ${d} feet.`,'feet'],[`A submarine is at −${s} meters. It rises ${r} meters, then drops ${d} meters.`,'meters']]);\n return {q:`${c[0]} Write an expression, then find the position.`,a:`−${s} + ${r} − ${d} = ${I(res)}`,\n e:`Start at −${s}. Rising ${r} gets to ${I(-s+r)}. Going down ${d} more gets to ${I(res)}.`}},\n// 16\n()=>{const [a,b]=distinct(10,90);const form=R(0,1);\n const expr=form?`−${a} + ${b}`:`${a} + (−${b})`;const pos=form?b>a:a>b;\n return {q:`Without adding, will ${expr} be positive, negative, or zero? Explain how you know.`,a:pos?'Positive':'Negative',\n e:`The signs are different, so the answer takes the sign of the number farther from zero. The ${pos?'positive':'negative'} number has the bigger absolute value.`}},\n// 17\n()=>{const n=R(5,40);const opts=shuffle([`−${n} + ${n}`,`${n} + ${n}`,`−${n} + ${n+1}`,`−${n} + (−${n})`]);\n return {q:`Which one equals 0? Decide without adding, and explain what's special about it.<br>${opts.join('<br>')}`,a:`−${n} + ${n}`,\n e:`−${n} and ${n} are opposites — the same distance from 0 on opposite sides — so they cancel.`}},\n// 18\n()=>{const a=R(3,20),b=R(3,20);\n return {q:`A student says: “Two negatives make a positive, so −${a} + (−${b}) = ${a+b}.” What's wrong?`,a:`−${a} + (−${b}) = −${a+b}`,\n e:`Adding two negatives moves you farther left, so the sum is negative. Add the distances (${a} + ${b}) and keep the negative sign.`,\n w:`“Two negatives make a positive” is about <b>subtracting<\/b> a negative. It is not a rule for adding.`}},\n// 19\n()=>{const a=R(5,30),b=R(5,30);let c;do{c=R(-20,b-1)}while(c===0);const x=c-b;\n return {q:`Find the missing number.<br>a. −${a} + ___ = 0<br>b. ${b} + ___ = ${I(c)}`,a:`a. ${a} &nbsp;&nbsp; b. ${I(x)}`,\n e:`a: the opposite of −${a} cancels it. b: to get from ${b} to ${I(c)} you move ${b-c} to the left, which is adding ${I(x)}.`}},\n// 20\n()=>{const s=pick([\n  ['The sum of two negative numbers is negative.','Always','Both moves go left. Example: −3 + (−4) = −7.'],\n  ['A positive number minus a negative number is negative.','Never','It turns into positive + positive. Example: 5 − (−2) = 7.'],\n  ['The difference of two negative numbers is negative.','Sometimes','−8 − (−3) = −5, but −3 − (−8) = 5.'],\n  ['A number plus its opposite equals 0.','Always','Opposites are the same distance from 0, so they cancel. Example: −12 + 12 = 0.'],\n  ['The sum of a positive and a negative number is positive.','Sometimes','−2 + 9 = 7, but −9 + 2 = −7. It depends on which is farther from 0.'],\n  ['A negative number minus a positive number is positive.','Never','You start left of 0 and move farther left. Example: −4 − 6 = −10.']]);\n return {q:`Always, sometimes, or never true?<br>“${s[0]}”`,a:s[1],e:s[2]}},\n// 21\n()=>{const all=shuffle([\n  ()=>{const a=R(5,40),b=R(2,30);return [`−${a} − (−${b})`,`−${a} + ${b}`]},\n  ()=>{const a=R(5,40),b=R(a+1,99);return [`${a} − ${b}`,`${a} + (−${b})`]},\n  ()=>{const a=R(5,90),b=R(2,60);return [`${a} − (−${b})`,`${a} + ${b}`]},\n  ()=>{const a=R(5,40),b=R(2,30);return [`−${a} − ${b}`,`−${a} + (−${b})`]}]).slice(0,3).map(f=>f());\n const L=['a','b','c'];\n return {q:`Rewrite each subtraction as addition. Don't solve yet.<br>${all.map((x,i)=>`${L[i]}. ${x[0]}`).join(' &nbsp;&nbsp; ')}`,\n a:all.map((x,i)=>`${L[i]}. ${x[1]}`).join(' &nbsp; '),\n e:`Subtracting a number is the same as adding its opposite. Keep the first number, change subtraction to addition, and flip the sign of the second number.`}},\n// 22\n()=>{const a=R(5,60),b=R(3,40);\n return {q:`Your balance is −$${a}. The bank removes a $${b} fee it charged by mistake (that's subtracting −${b}). Write the expression and the new balance. Why did the balance go up?`,\n a:`−${a} − (−${b}) = −${a} + ${b} = ${I(b-a)}`,\n e:`Taking away something negative is a positive change, so the balance rises by ${b}.`}},\n// 23\n()=>{const a=R(20,90),b=R(10,60);\n return {q:`A student wrote ${a} − (−${b}) = ${I(a-b)}. What did they do wrong?`,a:`Correct answer: ${a+b}`,\n e:`They treated it like ${a} − ${b}. Subtracting −${b} means adding ${b}: ${a} + ${b} = ${a+b}.`,\n w:`When you see two negative-looking signs side by side, rewrite as addition first.`}},\n// 24\n()=>{const [a,b]=distinct(3,25);\n return {q:`Find ${a} − ${b} and ${b} − ${a}. What do you notice?`,a:`${I(a-b)} and ${I(b-a)}. Order matters.`,\n e:`Switching the order gives the opposite answer. Addition doesn't care about order; subtraction does.`}},\n// 25\n()=>{const a=R(3,20),b=R(3,25);\n return {q:`How far apart are −${a} and ${b} on a number line? Write it as a subtraction problem.`,a:`${b} − (−${a}) = ${a+b}`,\n e:`From −${a} to 0 is ${a} steps, and from 0 to ${b} is ${b} more. ${a} + ${b} = ${a+b}.`}},\n// 26\n()=>{const L0=[[2,3],[3,4],[3,5],[4,5],[5,6],[5,8],[7,10],[7,12]];let x,y;do{x=pick(L0);y=pick(L0)}while(x[1]===y[1]);\n const L=lcm(x[1],y[1]),n1=x[0]*L/x[1],n2=y[0]*L/y[1];\n return {q:`Before solving, will −${F(x[0],x[1])} + (−${F(y[0],y[1])}) be greater than or less than −1? Then solve.`,\n a:`Less than −1. &nbsp;Answer: ${mixed(-(n1+n2),L)}`,\n e:`Both numbers are more than halfway to −1, so together they pass −1. Common denominator ${L}: −${F(n1,L)} + (−${F(n2,L)}) = −${F(n1+n2,L)} = ${mixed(-(n1+n2),L)}.`}},\n// 27\n()=>{let A,B;do{A=mix();B=mix()}while(A.d===B.d);const L=lcm(A.d,B.d),a1=A.T*L/A.d,b1=B.T*L/B.d,S=a1+b1;const est=Math.round(S/L);\n return {q:`−${A.w}${F(A.n,A.d)} − ${B.w}${F(B.n,B.d)}: about what should the answer be? Then find the exact answer.`,\n a:`About −${est}. &nbsp;Exact: ${mixed(-S,L)}`,\n e:`−${F(A.T,A.d)} − ${F(B.T,B.d)} = −${F(a1,L)} − ${F(b1,L)} = −${F(S,L)} = ${mixed(-S,L)}.`,\n w:`If your exact answer isn't close to your estimate, check it before moving on.`}},\n// 28\n()=>{let b,d;do{b=pick([2,3,4,5,6,8]);d=pick([2,3,4,5,6,8])}while(b===d);let a,c;do{a=R(1,b-1)}while(gcd(a,b)!==1);do{c=R(1,d-1)}while(gcd(c,d)!==1);\n const L=lcm(b,d),S=-a*L/b+c*L/d;\n return {q:`A student wrote −${F(a,b)} + ${F(c,d)} = ${F(a+c,b+d)}. Find two things wrong.`,\n a:`Correct answer: ${mixed(S,L)}`,\n e:`1) You can't add denominators — use a common one: −${F(a*L/b,L)} + ${F(c*L/d,L)}. 2) The signs matter: the ${S>0?'positive':'negative'} fraction is farther from zero, so the answer is ${S>0?'positive':'negative'}: ${mixed(S,L)}.`}},\n// 29\n()=>{let b,d;do{b=pick([2,3,4,5,6,8]);d=pick([2,3,4,5,6,8])}while(b===d);let a,c;do{a=R(1,b-1)}while(gcd(a,b)!==1);do{c=R(1,d-1)}while(gcd(c,d)!==1);\n const L=lcm(b,d),S=a*L/b+c*L/d;const [sn,sd]=simp(S,L);\n return {q:`${F(a,b)} − (−${F(c,d)})`,a:sn>sd?`${F(sn,sd)} = ${mixed(S,L)}`:mixed(S,L),\n e:`Subtracting a negative means adding: ${F(a*L/b,L)} + ${F(c*L/d,L)} = ${F(S,L)}${(sn!==S||S>L)?` = ${mixed(S,L)}`:''}.`}},\n// 30\n()=>{let A,B,L,S;do{A=mix();B=mix();L=lcm(A.d,B.d);S=-A.T*L/A.d+B.T*L/B.d}while(S===0);\n return {q:`−${A.w}${F(A.n,A.d)} + ${B.w}${F(B.n,B.d)}: is the answer positive or negative? Then solve.`,\n a:`${S>0?'Positive':'Negative'}. &nbsp;${mixed(S,L)}`,\n e:`${S>0?`${B.w}${F(B.n,B.d)}`:`−${A.w}${F(A.n,A.d)}`} is farther from zero, so the answer is ${S>0?'positive':'negative'}. −${F(A.T*L/A.d,L)} + ${F(B.T*L/B.d,L)} = ${S<0?'−':''}${F(Math.abs(S),L)} = ${mixed(S,L)}.`}},\n// 31\n()=>{const a=R(3,15),b=R(5,20),c=R(3,15);const r=a-b+c;\n return {q:`Solve ${a} + (−${b}) + ${c} two ways: left to right, then adding the positives first. Same answer? Why?`,a:`${I(r)} both ways`,\n e:`Left to right: ${a} + (−${b}) = ${I(a-b)}, then ${I(a-b)} + ${c} = ${I(r)}. Positives first: ${a} + ${c} = ${a+c}, then ${a+c} + (−${b}) = ${I(r)}. When everything is addition, you can reorder.`}},\n// 32\n()=>{const a=R(6,20),b=R(1,a-1),c=a-b;\n return {q:`Without a calculator, explain why −${a} − (−${b}) + ${c} equals 0.`,a:`−${a} + ${b} + ${c} = −${a} + ${a} = 0`,\n e:`Rewrite the subtraction as + ${b}. The ${b} and ${c} together make +${a}, which cancels −${a} exactly.`}},\n// 33\n()=>{let t;do{t=[];while(t.length<5){const v=R(-15,15);if(!t.includes(v))t.push(v)}}while(Math.min(...t)>=0||Math.max(...t)<=0);\n const lo=Math.min(...t),hi=Math.max(...t);\n return {q:`Low temperatures for a week:<div class='tscroll'><table class='data'><tr><th>Mon<\/th><th>Tue<\/th><th>Wed<\/th><th>Thu<\/th><th>Fri<\/th><\/tr><tr>${t.map(v=>`<td>${I(v)}<\/td>`).join('')}<\/tr><\/table><\/div>Find the lowest, highest, and range. Then explain why the range is <b>not<\/b> ${hi} − ${-lo}.`,\n a:`Low ${I(lo)}, high ${hi}, range ${hi} − (${I(lo)}) = ${hi-lo}`,\n e:`Range is the distance between highest and lowest, so it can't be negative. ${hi} − ${-lo} forgets that the lowest value is ${I(lo)}, not ${-lo}.`,\n w:`Put the negative number in parentheses: ${hi} − (${I(lo)}). It keeps you from dropping the sign.`}},\n// 34\n()=>{const s=R(10,80),d=R(10,90),c=R(5,60);const r=-s+d-c;\n return {q:`Your account is at −$${s}. You deposit $${d}, then a $${c} charge comes out. Write one expression and find the balance.`,\n a:`−${s} + ${d} − ${c} = ${I(r)}`,e:`−${s} + ${d} = ${I(d-s)}, then ${I(d-s)} − ${c} = ${I(r)}.`}},\n// 35\n()=>{const Rg=R(20,80);if(R(0,1)){const L=R(5,30);\n return {q:`A set of numbers has a range of ${Rg}. The lowest value is −${L}. What is the highest value?`,a:`${Rg-L}`,\n e:`Highest − (−${L}) = ${Rg}, so highest + ${L} = ${Rg}, so highest = ${Rg-L}. Check: ${I(Rg-L)} − (−${L}) = ${Rg}.`}}\n const H=R(5,40);\n return {q:`A set of numbers has a range of ${Rg}. The highest value is ${H}. What is the lowest value?`,a:I(H-Rg),\n e:`${H} − lowest = ${Rg}, so the lowest is ${Rg} below ${H}: ${H} − ${Rg} = ${I(H-Rg)}. Check: ${H} − (${I(H-Rg)}) = ${Rg}.`}},\n// 36\n()=>{const [a,b]=distinct(2,15);const pos=b>a;\n return {q:`Without calculating, will −${a} − (−${b}) be positive or negative? Then swap the numbers and predict again.`,\n a:`${pos?'Positive':'Negative'} (${I(b-a)}). Swapped: −${b} − (−${a}) = ${I(a-b)}`,\n e:`−${a} − (−${b}) becomes −${a} + ${b}. It's positive when the number being subtracted is farther left (more negative) than the first number.`}}\n];\n\n\nconst SECTIONS=[{\"id\":\"frac\",\"t\":\"Simplifying and mixed numbers\"},{\"id\":\"abs\",\"t\":\"Absolute value\"},{\"id\":\"ints\",\"t\":\"Integers in real situations\"},{\"id\":\"add\",\"t\":\"Adding integers\"},{\"id\":\"sub\",\"t\":\"Subtracting integers\"},{\"id\":\"rat\",\"t\":\"Fractions and mixed numbers with signs\"},{\"id\":\"multi\",\"t\":\"Multi-step problems and range\"}];\nconst frac=h=>h.replace(/\\{(\\d+)\\/(\\d+)\\}/g,'<span class=\"fr\"><span>$1<\/span><span>$2<\/span><\/span>');\nconst KEY=\"ch1-concept-check-v3\";\nlet state={marks:{},mode:\"topic\"};\ntry{const s=JSON.parse(localStorage.getItem(KEY)||\"null\");if(s&&typeof s===\"object\"){state.marks=s.marks||{};state.mode=s.mode||\"topic\"}}catch(e){}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}\n\nconst qs=[...document.querySelectorAll('.q')];\nconst secs=[...document.querySelectorAll('section[data-topic]')];\nconst mixedEl=document.getElementById('mixed');\nconst hint=document.getElementById('modehint');\nconst nomissed=document.getElementById('nomissed');\nconst nav=document.getElementById('nav');\nlet order=null;\n\nfunction layout(){\n  const mode=state.mode;\n  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));\n  nav.hidden = mode!==\"topic\";\n  if(mode===\"mixed\"){\n    if(!order) order=shuffle(qs);\n    secs.forEach(s=>s.hidden=true);\n    nomissed.hidden=true;\n    mixedEl.hidden=false;\n    order.forEach((d,i)=>{d.hidden=false;mixedEl.appendChild(d);d.querySelector('.num').textContent=(i+1)+'.'});\n    hint.textContent=\"Shuffled with the topic headings removed, like a real test. Tap Mixed test again to reshuffle.\";\n    hint.hidden=false;\n    return;\n  }\n  mixedEl.hidden=true;\n  secs.forEach(s=>qs.filter(d=>d.dataset.s===s.dataset.topic).forEach(d=>{s.appendChild(d);d.querySelector('.num').textContent=d.dataset.id+'.'}));\n  if(mode===\"missed\"){\n    let any=0;\n    qs.forEach(d=>{const m=state.marks[d.dataset.id]===\"miss\";d.hidden=!m;if(m)any++});\n    secs.forEach(s=>s.hidden=!qs.some(d=>d.dataset.s===s.dataset.topic&&!d.hidden));\n    nomissed.hidden=any>0;\n    hint.textContent=\"Only the questions you missed. Tap “Try a new one like this” to retest with new numbers.\";\n    hint.hidden=false;\n  } else {\n    qs.forEach(d=>d.hidden=false);\n    secs.forEach(s=>s.hidden=false);\n    nomissed.hidden=true;\n    hint.hidden=true;\n  }\n}\n\nfunction paint(){\n  let got=0,miss=0;const missed={};\n  qs.forEach(d=>{\n    const id=d.dataset.id,m=state.marks[id];\n    d.classList.toggle('got',m==='got');d.classList.toggle('miss',m==='miss');\n    if(m)d.querySelector(':scope > details').open=true;\n    d.querySelector('.yes').setAttribute('aria-pressed',m==='got');\n    d.querySelector('.no').setAttribute('aria-pressed',m==='miss');\n    if(m!=='miss')clearPractice(d);\n    if(m==='got')got++;\n    if(m==='miss'){miss++;(missed[d.dataset.s]=missed[d.dataset.s]||[]).push(id)}\n  });\n  const t=qs.length;\n  document.getElementById('score').textContent=(got+miss)+' of '+t+' marked · '+got+' right';\n  document.getElementById('barG').style.width=(got/t*100)+'%';\n  document.getElementById('barM').style.width=(miss/t*100)+'%';\n  const r=document.getElementById('review');\n  if(got+miss===0) r.innerHTML='<h2>What to review<\/h2><p>Mark questions as you go and your weak spots will show up here.<\/p>';\n  else if(!miss) r.innerHTML='<h2>What to review<\/h2><p>Nothing missed so far. '+(got+miss<t?'Keep going — '+(t-got-miss)+' left.':\"You're ready for this test.\")+'<\/p>';\n  else r.innerHTML='<h2>What to review<\/h2><p>Go back over these topics. Then tap <b>Missed only<\/b> at the top and retest each one with new numbers until you get it.<\/p><ul>'+\n    SECTIONS.filter(s=>missed[s.id]).map(s=>'<li><a class=\"golink\" href=\"#'+s.id+'\">'+s.t+'<\/a> — question'+(missed[s.id].length>1?'s ':' ')+missed[s.id].join(', ')+'<\/li>').join('')+'<\/ul>';\n}\n\nfunction clearPractice(d){const p=d.querySelector('.practice');if(p.innerHTML){p.innerHTML=''}d.classList.remove('practicing')}\nfunction renderPractice(d){\n  const p=d.querySelector('.practice');\n  const avoid=[d.querySelector(':scope > details .hand').innerHTML];\n  const prev=p.querySelector('.hand');if(prev)avoid.push(prev.innerHTML);\n  let o,tries=0;do{o=GEN[+d.dataset.id-1]();tries++}while(tries<20&&avoid.includes(frac(o.a)));\n  p.innerHTML='<div class=\"pcard\"><span class=\"kind\">Same idea, new numbers<\/span><div>'+frac(o.q)+'<\/div>'+\n    '<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">'+frac(o.a)+'<\/p><p class=\"why\">'+frac(o.e)+'<\/p>'+\n    (o.w?'<p class=\"watch\"><b>Watch out:<\/b> '+frac(o.w)+'<\/p>':'')+\n    '<div class=\"pself\"><button class=\"pgot\" type=\"button\">Got it this time<\/button><button class=\"pnew\" type=\"button\">Missed — new numbers<\/button><\/div><\/div><\/details><\/div>';\n  d.classList.add('practicing');\n  const card=p.querySelector('.pcard');\n  card.scrollIntoView({block:'nearest'});\n  card.querySelector('summary').focus({preventScroll:true});\n}\n\ndocument.getElementById('main').addEventListener('click',e=>{\n  const d=e.target.closest('.q');if(!d)return;const id=d.dataset.id;const c=e.target.classList;\n  if(c.contains('yes')){state.marks[id]==='got'?delete state.marks[id]:state.marks[id]='got';save();paint()}\n  else if(c.contains('no')){state.marks[id]==='miss'?delete state.marks[id]:state.marks[id]='miss';save();paint()}\n  else if(c.contains('retry')||c.contains('pnew')){renderPractice(d)}\n  else if(c.contains('pgot')){state.marks[id]='got';save();paint()}\n});\ndocument.querySelector('.modes').addEventListener('click',e=>{\n  const b=e.target.closest('button');if(!b)return;\n  if(b.dataset.mode==='mixed'&&state.mode==='mixed')order=shuffle(qs);\n  state.mode=b.dataset.mode;save();layout();\n  window.scrollTo(0,document.querySelector('.modes').offsetTop-10);\n});\ndocument.getElementById('review').addEventListener('click',e=>{\n  if(e.target.classList.contains('golink')&&state.mode!=='topic'){state.mode='topic';save();layout()}\n});\ndocument.querySelectorAll('.restart').forEach(b=>b.addEventListener('click',e=>{\n  e.preventDefault();\n  if(!confirm('Clear all answers and marks and start over?'))return;\n  state={marks:{},mode:\"topic\"};order=null;save();\n  qs.forEach(d=>{d.querySelector(':scope > details').open=false;clearPractice(d)});\n  layout();paint();window.scrollTo(0,0);\n}));\nlayout();paint();\n\n<\/script>\n<\/body>\n<\/html>"}, {"id": "2", "title": "Chapter 2", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Chapter 2 Concept Check<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --paper:#FAFCFA; --grid:#E1EEE4; --ink:#1C2B23; --muted:#56695E;\n  --pen:#1B7A45; --redpen:#C8322B; --ok:#1B7A45; --card:#FFFFFF; --line:#C5DACB;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --paper:#122019; --grid:#1A2C22; --ink:#E4F0E8; --muted:#A0B8A9;\n    --pen:#6FD39A; --redpen:#FF8A80; --ok:#6FD39A; --card:#182A20; --line:#2F4A3A;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --paper:#122019; --grid:#1A2C22; --ink:#E4F0E8; --muted:#A0B8A9;\n  --pen:#6FD39A; --redpen:#FF8A80; --ok:#6FD39A; --card:#182A20; --line:#2F4A3A;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{\n  margin:0; color:var(--ink); background-color:var(--paper);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:24px 24px;\n  font-family:\"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  font-size:1.0625rem; line-height:1.55;\n}\n.wrap{max-width:44rem; margin:0 auto; padding:1.5rem 1rem 6rem}\nheader h1{font-family:\"Caveat\",\"Bradley Hand\",\"Comic Sans MS\",cursive; font-weight:700; color:var(--pen); font-size:clamp(2.6rem,9vw,3.6rem); line-height:1; margin:.5rem 0 .5rem}\nheader p{margin:.25rem 0; max-width:36rem}\n.how{color:var(--muted); font-size:.95rem}\nnav{display:flex; flex-wrap:wrap; gap:.4rem; margin:1.25rem 0 .5rem}\nnav a{font-size:.9rem; color:var(--ink); text-decoration:none; border:1px solid var(--line); background:var(--card); padding:.35rem .7rem; border-radius:999px}\nnav a:hover{border-color:var(--pen)}\n.tally{position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:2px solid var(--ink); padding:.6rem 0; margin-bottom:1rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; font-size:.95rem}\n.bar{flex:1 1 8rem; height:.5rem; background:var(--grid); border-radius:4px; overflow:hidden; display:flex}\n.bar i{display:block; height:100%}\n.bar .g{background:var(--ok)} .bar .m{background:var(--redpen)}\n.tally button{font:inherit; font-size:.85rem; background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:.3rem .6rem; cursor:pointer}\nsection{margin:2.5rem 0}\nsection h2{font-size:1.35rem; margin:0 0 .2rem; border-bottom:1px solid var(--ink); padding-bottom:.3rem}\nsection .skill{color:var(--muted); font-size:.95rem; margin:.3rem 0 1rem}\n.q{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:4px; padding:1rem 1rem .9rem; margin:0 0 .9rem}\n.q.got{border-left-color:var(--ok)} .q.miss{border-left-color:var(--redpen)}\n.qhead{display:flex; gap:.6rem}\n.num{font-weight:700; min-width:1.8rem}\n.qtext{flex:1}\n.kind{display:block; font-size:.82rem; color:var(--muted); margin-bottom:.15rem}\n.reveal{margin-top:.75rem; font:inherit; font-size:.95rem; font-weight:700; color:var(--pen); background:none; border:1.5px solid var(--pen); border-radius:6px; padding:.45rem .9rem; cursor:pointer; min-height:44px}\n\n\n.q.open .reveal{display:none}\n.hand{font-family:\"Caveat\",\"Bradley Hand\",\"Comic Sans MS\",cursive; color:var(--pen); font-size:1.85rem; line-height:1.15; font-weight:700; margin:0 0 .35rem}\n.why{margin:.2rem 0}\n.watch{margin:.6rem 0 0; color:var(--redpen); font-size:.95rem}\n.watch b{font-weight:700}\n.self{display:flex; gap:.5rem; margin-top:.8rem; flex-wrap:wrap}\n.self button{font:inherit; font-size:.9rem; min-height:44px; padding:.4rem .9rem; border-radius:6px; cursor:pointer; background:var(--card); color:var(--ink); border:1.5px solid var(--line)}\n.self .yes[aria-pressed=\"true\"]{background:var(--ok); border-color:var(--ok); color:var(--paper)}\n.self .no[aria-pressed=\"true\"]{background:var(--redpen); border-color:var(--redpen); color:var(--paper)}\nbutton:focus-visible, a:focus-visible{outline:3px solid var(--pen); outline-offset:2px}\n.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.05; font-size:.85em; margin:0 .08em}\n.fr span:first-child{border-bottom:1.5px solid currentColor; padding:0 .15em}\n.hand .fr{font-size:.8em}\ntable.data{border-collapse:collapse; margin:.5rem 0; font-size:.95rem}\n.tscroll{overflow-x:auto; max-width:100%}\ntable.data td,table.data th{border:1px solid var(--line); padding:.3rem .55rem; text-align:center; white-space:nowrap}\n#review{border:2px solid var(--ink); background:var(--card); border-radius:4px; padding:1rem}\n#review h2{border:0; margin:0 0 .4rem; padding:0}\n#review ul{margin:.4rem 0 0; padding-left:1.2rem}\n#review li{margin:.2rem 0}\n@media (prefers-reduced-motion: no-preference){ .q.open .ans{animation:ink .25s ease-out} @keyframes ink{from{opacity:0}to{opacity:1}} }\n\n\ndetails.ans{display:block;margin-top:.75rem;padding:0;border:0}\ndetails.ans>summary{display:inline-block;list-style:none;font-weight:700;font-size:.95rem;color:var(--pen);border:1.5px solid var(--pen);border-radius:6px;padding:.55rem .9rem;cursor:pointer}\ndetails.ans>summary::-webkit-details-marker{display:none}\ndetails.ans[open]>summary{display:none}\ndetails.ans .inner{padding-top:.7rem;border-top:1px dashed var(--line)}\n.self,.tally,#review-wrap{display:none}\n.restart{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;font-size:1.05rem;color:#fff;text-decoration:none;background:var(--pen);border:2px solid var(--pen);border-radius:8px;padding:.7rem 1.2rem;min-height:48px;box-shadow:0 2px 0 var(--ink)}\n.restart:active{transform:translateY(2px);box-shadow:none}\n.restart.armed{background:var(--redpen);border-color:var(--redpen)}\n:root:not([data-theme=\"light\"]) .restart{color:var(--paper)}\n.topbar{position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:2px solid var(--ink);padding:.6rem 0;margin:1rem 0;display:flex;align-items:center;justify-content:flex-end;gap:.75rem}\n.topbar .tally{position:static;border:0;padding:0;margin:0;flex:1 1 0;min-width:0;background:none;flex-direction:column;align-items:stretch;gap:.35rem;font-size:.9rem}\n.topbar .tally .bar{flex:none;width:100%}\n.topbar .restart{flex:none}\n.restart-bottom{margin:2rem 0 1rem}\n.restart-bottom .restart{width:100%;font-size:1.15rem;min-height:56px}\n[hidden]{display:none!important}\n.modes{display:none;margin:1rem 0 0}\nhtml.js .modes{display:flex}\n.modes button{flex:1 1 0;min-height:46px;font:inherit;font-size:.92rem;font-weight:700;border:1.5px solid var(--pen);background:var(--card);color:var(--pen);padding:.4rem .4rem;cursor:pointer}\n.modes button+button{border-left:0}\n.modes button:first-child{border-radius:8px 0 0 8px}.modes button:last-child{border-radius:0 8px 8px 0}\n.modes button[aria-pressed=\"true\"]{background:var(--pen);color:var(--paper)}\n.modehint{color:var(--muted);font-size:.92rem;margin:.5rem 0 0}\n.retry{display:none;margin-top:.75rem;font:inherit;font-size:.95rem;font-weight:700;color:var(--redpen);background:none;border:1.5px solid var(--redpen);border-radius:6px;padding:.55rem .9rem;min-height:44px;cursor:pointer}\nhtml.js .q.miss .retry{display:inline-block}\n.q.practicing .retry{display:none!important}\n.pcard{margin-top:.9rem;padding:.9rem;border:1.5px dashed var(--pen);border-radius:6px;background:var(--paper)}\n.pcard>.kind{color:var(--pen);font-weight:700}\n.pself{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}\n.pself button{font:inherit;font-size:.9rem;min-height:44px;padding:.4rem .9rem;border-radius:6px;cursor:pointer}\n.pgot{background:var(--ok);border:1.5px solid var(--ok);color:var(--paper)}\n.pnew{background:var(--card);border:1.5px solid var(--redpen);color:var(--redpen)}\n#nomissed{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1rem}\nhtml.js .self{display:flex} html.js .tally{display:flex} html.js #review-wrap{display:block}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <h1>Chapter 2 concept check<\/h1>\n  <p>Same topics as the Chapter 2 test review, but these questions ask <em>why<\/em> and try to catch the mistakes that cost points. Try them without a calculator.<\/p>\n  <p class=\"how\">Work each one on paper first. Then show the answer and check yourself honestly.<\/p>\n<\/header>\n<div class=\"modes\" role=\"group\" aria-label=\"How to practice\"><button type=\"button\" data-mode=\"topic\">By topic<\/button><button type=\"button\" data-mode=\"mixed\">Mixed test<\/button><button type=\"button\" data-mode=\"missed\">Missed only<\/button><\/div>\n<p class=\"modehint\" id=\"modehint\" hidden><\/p>\n<nav id=\"nav\" aria-label=\"Topics\"><a href=\"#forms\">Mixed numbers and improper fractions<\/a><a href=\"#signs\">Sign rules for multiplying and dividing<\/a><a href=\"#intops\">Multiplying and dividing integers<\/a><a href=\"#order\">Order of operations<\/a><a href=\"#fracops\">Multiplying and dividing fractions<\/a><a href=\"#dec\">Fractions as decimals<\/a><a href=\"#word\">Word problems<\/a><\/nav>\n<div class=\"topbar\"><div class=\"tally\" aria-live=\"polite\"><span id=\"score\"><\/span><div class=\"bar\" aria-hidden=\"true\"><i class=\"g\" id=\"barG\"><\/i><i class=\"m\" id=\"barM\"><\/i><\/div><\/div><a class=\"restart\" href=\"\">↺ Start over<\/a><\/div>\n<main id=\"main\"><section id=\"mixed\" hidden><\/section><p id=\"nomissed\" hidden>Nothing marked missed yet. Mark questions as you go, then come back here to retest them.<\/p><section id=\"forms\" data-topic=\"forms\"><h2>Mixed numbers and improper fractions<\/h2><p class=\"skill\">Builds on Review questions 1–3<\/p><div class=\"q\" data-id=\"1\" data-s=\"forms\"><div class=\"qhead\"><span class=\"num\">1.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>What's the difference between a mixed number and an improper fraction? Which is <span class=\"fr\"><span>7<\/span><span>3<\/span><\/span>, and why isn't it called “wrong”?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">Mixed number = whole + fraction. <span class=\"fr\"><span>7<\/span><span>3<\/span><\/span> is an improper fraction.<\/p><p class=\"why\">Improper just means the numerator is at least as big as the denominator, so the value is 1 or more. Nothing is wrong with it — it's often easier to compute with.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"2\" data-s=\"forms\"><div class=\"qhead\"><span class=\"num\">2.<\/span><div class=\"qtext\"><span class=\"kind\">Find the mistake<\/span>A student wrote: −7<span class=\"fr\"><span>2<\/span><span>9<\/span><\/span> = −<span class=\"fr\"><span>63<\/span><span>9<\/span><\/span> + <span class=\"fr\"><span>2<\/span><span>9<\/span><\/span> = −<span class=\"fr\"><span>61<\/span><span>9<\/span><\/span>. What's wrong, and what's the right answer?<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−<span class=\"fr\"><span>65<\/span><span>9<\/span><\/span><\/p><p class=\"why\">The negative applies to the <b>whole<\/b> amount, not just the 7. −7<span class=\"fr\"><span>2<\/span><span>9<\/span><\/span> means −(7 + <span class=\"fr\"><span>2<\/span><span>9<\/span><\/span>) = −<span class=\"fr\"><span>65<\/span><span>9<\/span><\/span>. Convert the positive part first, then put the negative sign back on.<\/p><p class=\"watch\"><b>Watch out:<\/b> Any time a mixed number is negative, convert 7<span class=\"fr\"><span>2<\/span><span>9<\/span><\/span> first and attach the minus sign at the end.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"3\" data-s=\"forms\"><div class=\"qhead\"><span class=\"num\">3.<\/span><div class=\"qtext\"><span class=\"kind\">Explain<\/span>Convert −<span class=\"fr\"><span>36<\/span><span>16<\/span><\/span> to a mixed number in simplest form. Could you simplify <b>before<\/b> converting? Try both orders.<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">−2<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span><\/p><p class=\"why\">Convert first: −2<span class=\"fr\"><span>4<\/span><span>16<\/span><\/span>, then simplify <span class=\"fr\"><span>4<\/span><span>16<\/span><\/span> to <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>. Or simplify first: <span class=\"fr\"><span>36<\/span><span>16<\/span><\/span> = <span class=\"fr\"><span>9<\/span><span>4<\/span><\/span>, then convert to 2<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>. Same answer either way.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"4\" data-s=\"forms\"><div class=\"qhead\"><span class=\"num\">4.<\/span><div class=\"qtext\"><span class=\"kind\">True or false<\/span>“Every improper fraction is greater than 1.”<\/div><\/div>\n<details class=\"ans\"><summary>Show answer<\/summary><div class=\"inner\"><p class=\"hand\">False<\/p><p class=\"why\"><span class=\"fr\"><span>3<\/span><span>3<\/span><\/span> is improper but equals exactly 1, and −<span class=\"fr\"><span>7<\/span><span>3<\/span><\/span> is improper but is less than 1 because it's negative. Improper describes the <em>form<\/em> (top ≥ bottom), not the size.<\/p>\n<div class=\"self\"><button class=\"yes\" type=\"button\" aria-pressed=\"false\">I got it<\/button><button class=\"no\" type=\"button\" aria-pressed=\"false\">I missed it<\/button><\/div><\/div><\/details><button class=\"retry\" type=\"button\">Try a new one like this<\/button><div class=\"practice\"><\/div><\/div>\n<div class=\"q\" data-id=\"5\" data-s=\"forms\"><div class=\"qhead\"><span class=\"num\">5.<\/span><div class=\"qtext\"><span class=\"kind\">Compare<\/span>Which is greater: −2<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> or −2<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>? Explain with a number line.<\/div><\/div>\n<details clas
